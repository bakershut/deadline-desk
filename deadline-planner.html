<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadline Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F8;--surface:#FFFFFF;--ink:#16233F;--muted:#5C6B87;--line:#D5DDEB;
  --hi:#FFD84D;--hi-ink:#3A2F00;--high:#D93F2B;--med:#E08A12;--low:#2E8B6A;--accent:#2B4EFF;
  --grid:rgba(43,78,255,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F172A;--surface:#17233D;--ink:#E8EEFB;--muted:#9AA9C7;--line:#2A3A5E;--hi:#FFD84D;--hi-ink:#3A2F00;--high:#FF6B57;--med:#F2A540;--low:#4CC49A;--accent:#7C95FF;--grid:rgba(124,149,255,.08)}
}
:root[data-theme="dark"]{--bg:#0F172A;--surface:#17233D;--ink:#E8EEFB;--muted:#9AA9C7;--line:#2A3A5E;--hi:#FFD84D;--hi-ink:#3A2F00;--high:#FF6B57;--med:#F2A540;--low:#4CC49A;--accent:#7C95FF;--grid:rgba(124,149,255,.08)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
h1{font-size:clamp(28px,5vw,40px);font-weight:800}
h1 mark{background:var(--hi);color:var(--hi-ink);padding:0 .2em;border-radius:3px}
.sub{color:var(--muted);margin:4px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--low);border-color:var(--low);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.stat b{display:block;font:800 26px "Bricolage Grotesque",sans-serif}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--high)}
form.add{display:grid;grid-template-columns:2fr 1fr 1.2fr 1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:18px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
label.sr{position:absolute;left:-9999px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col{background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px dashed var(--line);border-radius:12px;padding:10px;min-height:220px}
.col.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.col h2{font-size:16px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.col h2 small{color:var(--muted);font:600 13px Figtree,sans-serif}
.card{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--low);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:grab}
.card.p-high{border-left-color:var(--high)}.card.p-med{border-left-color:var(--med)}.card.p-low{border-left-color:var(--low)}
.card.dragging{opacity:.4}
.card h3{font-size:15px;font-weight:700;margin-bottom:2px}
.card.done h3{text-decoration:line-through;color:var(--muted)}
.meta{color:var(--muted);font-size:13px}
.due{font-weight:600;font-size:13px;margin-top:6px}
.due.late{color:var(--high)}.due.soon{color:var(--med)}.due.ok{color:var(--low)}
.row{display:flex;gap:6px;margin-top:8px;align-items:center}
.row select{padding:4px 6px;font-size:13px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;font-size:13px}
.x:hover{color:var(--high)}
.empty{color:var(--muted);font-size:13px;padding:8px 4px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:12px}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead h2{font-size:17px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font-size:12px;color:var(--muted);padding:2px 0}
.day{aspect-ratio:1;border:1px solid transparent;border-radius:8px;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;padding:0}
.day:hover{background:var(--bg)}
.day.today{border-color:var(--accent);font-weight:700}
.day.sel{background:var(--hi);color:var(--hi-ink)}
.day.out{opacity:.35}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--low)}
.dots i.h{background:var(--high)}.dots i.m{background:var(--med)}
.filter{margin-top:10px;font-size:13px;color:var(--muted)}
.filter button{margin-left:6px}
.toast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;max-width:320px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
@media (max-width:900px){.layout{grid-template-columns:1fr}.cal{position:static}form.add{grid-template-columns:1fr 1fr}form.add input:first-child{grid-column:1/-1}}
@media (max-width:700px){.board{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Deadline <mark>Desk</mark></h1>
      <p class="sub">Every assignment, quiz and submission in one place.</p>
    </div>
    <div class="tools">
      <select id="lead" class="btn" aria-label="Remind me before due time">
        <option value="30">Remind 30 min before</option>
        <option value="60">Remind 1 hour before</option>
        <option value="1440" selected>Remind 1 day before</option>
      </select>
      <button class="btn" id="notif">Turn on reminders</button>
      <button class="btn" id="theme">Switch theme</button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <form class="add" id="form">
    <label class="sr" for="t">Task title</label><input id="t" required maxlength="80" placeholder="e.g. DBMS assignment 3">
    <label class="sr" for="s">Subject</label><input id="s" maxlength="30" placeholder="Subject">
    <label class="sr" for="d">Due date and time</label><input id="d" type="datetime-local" required>
    <label class="sr" for="p">Priority</label>
    <select id="p"><option value="high">High priority</option><option value="med" selected>Medium priority</option><option value="low">Low priority</option></select>
    <button class="btn primary" type="submit">Add task</button>
  </form>

  <div class="layout">
    <main class="board" id="board"></main>
    <aside class="cal" aria-label="Calendar">
      <div class="calhead">
        <button class="btn" id="prev" aria-label="Previous month">‹</button>
        <h2 id="mon"></h2>
        <button class="btn" id="next" aria-label="Next month">›</button>
      </div>
      <div class="grid" id="cal"></div>
      <div class="filter" id="filter"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  var COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
  var PR={high:"High",med:"Medium",low:"Low"};
  var KEY="deadline-desk-v1";
  var tasks=[],lead=1440,selDay=null,view=new Date();view.setDate(1);

  function pad(n){return String(n).padStart(2,"0")}
  function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
  function iso(d){return dkey(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

  function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks:tasks,lead:lead}))}catch(e){}}
  function load(){
    try{var r=JSON.parse(localStorage.getItem(KEY)||"null");if(r&&r.tasks){tasks=r.tasks;lead=r.lead||1440;return}}catch(e){}
    var n=new Date();function at(days,h,m){var d=new Date(n);d.setDate(d.getDate()+days);d.setHours(h,m,0,0);return iso(d)}
    tasks=[
      {id:uid(),title:"DBMS assignment 3: normalization",subject:"DBMS",due:at(1,23,59),priority:"high",status:"doing"},
      {id:uid(),title:"OS lab record submission",subject:"Operating Systems",due:at(2,10,0),priority:"med",status:"todo"},
      {id:uid(),title:"Maths quiz 2 revision",subject:"Maths",due:at(4,9,0),priority:"med",status:"todo"},
      {id:uid(),title:"Capstone review slides",subject:"Project",due:at(6,14,0),priority:"high",status:"todo"},
      {id:uid(),title:"Resume update for placements",subject:"Career",due:at(8,18,0),priority:"low",status:"todo"},
      {id:uid(),title:"Networks tutorial sheet",subject:"CN",due:at(-1,17,0),priority:"low",status:"done"}
    ];
  }

  function span(ms){
    var m=Math.floor(Math.abs(ms)/60000),d=Math.floor(m/1440),h=Math.floor(m%1440/60);m=m%60;
    return d>=1?d+"d "+h+"h":h>=1?h+"h "+m+"m":m+"m";
  }
  function dueInfo(t){
    if(t.status==="done")return {txt:"Completed",cls:"ok"};
    var ms=new Date(t.due)-new Date();
    if(ms<0)return {txt:"Overdue by "+span(ms),cls:"late"};
    return {txt:"Due in "+span(ms),cls:ms<864e5*2?"soon":"ok"};
  }
  function fmtDue(s){return new Date(s).toLocaleString([], {weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}

  function renderStats(){
    var now=new Date(),wk=new Date(now.getTime()+7*864e5);
    var open=tasks.filter(function(t){return t.status!=="done"});
    var late=open.filter(function(t){return new Date(t.due)<now}).length;
    var week=open.filter(function(t){var d=new Date(t.due);return d>=now&&d<=wk}).length;
    var done=tasks.length-open.length;
    var pct=tasks.length?Math.round(done/tasks.length*100):0;
    document.getElementById("stats").innerHTML=
      '<div class="stat"><b>'+open.length+'</b><span>Open tasks</span></div>'+
      '<div class="stat"><b>'+week+'</b><span>Due in 7 days</span></div>'+
      '<div class="stat'+(late?" warn":"")+'"><b>'+late+'</b><span>Overdue</span></div>'+
      '<div class="stat"><b>'+pct+'%</b><span>Completed</span></div>';
  }

  function renderBoard(){
    var b=document.getElementById("board");b.innerHTML="";
    COLS.forEach(function(c){
      var list=tasks.filter(function(t){return t.status===c[0]&&(!selDay||t.due.slice(0,10)===selDay)})
        .sort(function(a,b){return new Date(a.due)-new Date(b.due)});
      var col=document.createElement("section");col.className="col";col.dataset.status=c[0];
      col.innerHTML='<h2>'+c[1]+' <small>'+list.length+'</small></h2>'+(list.length?"":'<div class="empty">'+(selDay?"Nothing on this day.":"Nothing here yet.")+'</div>');
      list.forEach(function(t){
        var i=dueInfo(t),el=document.createElement("article");
        el.className="card p-"+t.priority+(t.status==="done"?" done":"");el.draggable=true;el.dataset.id=t.id;
        el.innerHTML='<h3>'+esc(t.title)+'</h3><div class="meta">'+esc(t.subject||"General")+' · '+PR[t.priority]+' priority</div>'+
          '<div class="meta">'+fmtDue(t.due)+'</div><div class="due '+i.cls+'">'+i.txt+'</div>'+
          '<div class="row"><select aria-label="Move task" data-mv="'+t.id+'">'+COLS.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===t.status?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>'+
          '<button class="x" data-del="'+t.id+'">Delete</button></div>';
        el.addEventListener("dragstart",function(e){el.classList.add("dragging");e.dataTransfer.setData("text/plain",t.id)});
        el.addEventListener("dragend",function(){el.classList.remove("dragging")});
        col.appendChild(el);
      });
      col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("over")});
      col.addEventListener("dragleave",function(){col.classList.remove("over")});
      col.addEventListener("drop",function(e){e.preventDefault();col.classList.remove("over");move(e.dataTransfer.getData("text/plain"),c[0])});
      b.appendChild(col);
    });
  }

  function renderCal(){
    var y=view.getFullYear(),m=view.getMonth(),g=document.getElementById("cal");
    document.getElementById("mon").textContent=view.toLocaleString([], {month:"long",year:"numeric"});
    var html=["S","M","T","W","T","F","S"].map(function(d){return '<div class="dow">'+d+'</div>'}).join("");
    var start=new Date(y,m,1-new Date(y,m,1).getDay()),today=dkey(new Date());
    for(var i=0;i<42;i++){
      var d=new Date(start);d.setDate(start.getDate()+i);var k=dkey(d);
      var ts=tasks.filter(function(t){return t.due.slice(0,10)===k&&t.status!=="done"});
      var dots=ts.slice(0,3).map(function(t){return '<i class="'+(t.priority==="high"?"h":t.priority==="med"?"m":"")+'"></i>'}).join("");
      html+='<button class="day'+(d.getMonth()!==m?" out":"")+(k===today?" today":"")+(k===selDay?" sel":"")+'" data-day="'+k+'" aria-label="'+d.toDateString()+', '+ts.length+' tasks due">'+d.getDate()+'<span class="dots">'+dots+'</span></button>';
    }
    g.innerHTML=html;
    document.getElementById("filter").innerHTML=selDay?'Showing '+new Date(selDay+"T00:00").toDateString()+'<button class="btn" id="clr">Show all</button>':"Tap a date to see what’s due that day.";
  }

  function render(){renderStats();renderBoard();renderCal()}
  function move(id,st){tasks.forEach(function(t){if(t.id===id)t.status=st});save();render()}

  document.getElementById("form").addEventListener("submit",function(e){
    e.preventDefault();
    var $=function(i){return document.getElementById(i)};
    tasks.push({id:uid(),title:$("t").value.trim(),subject:$("s").value.trim(),due:$("d").value,priority:$("p").value,status:"todo",notified:false});
    e.target.reset();$("p").value="med";
    var nx=new Date();nx.setDate(nx.getDate()+1);nx.setHours(23,59,0,0);$("d").value=iso(nx);
    save();render();toast("Task added.");
  });
  document.addEventListener("change",function(e){if(e.target.dataset.mv)move(e.target.dataset.mv,e.target.value)});
  document.addEventListener("click",function(e){
    var x=e.target;
    if(x.dataset.del){tasks=tasks.filter(function(t){return t.id!==x.dataset.del});save();render();toast("Task deleted.")}
    if(x.dataset.day){selDay=selDay===x.dataset.day?null:x.dataset.day;render()}
    if(x.id==="clr"){selDay=null;render()}
  });
  document.getElementById("prev").onclick=function(){view.setMonth(view.getMonth()-1);renderCal()};
  document.getElementById("next").onclick=function(){view.setMonth(view.getMonth()+1);renderCal()};

  var tt;function toast(m){var el=document.getElementById("toast");el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(function(){el.hidden=true},5000)}

  var nb=document.getElementById("notif");
  function syncNotif(){
    if(!("Notification" in window)){nb.textContent="Reminders unsupported";nb.disabled=true;return}
    if(Notification.permission==="granted"){nb.textContent="Reminders on";nb.classList.add("on")}
    else if(Notification.permission==="denied"){nb.textContent="Reminders blocked"}
  }
  nb.onclick=function(){
    if(!("Notification" in window))return;
    Notification.requestPermission().then(function(){syncNotif();toast(Notification.permission==="granted"?"Reminders are on.":"Allow notifications in your browser to get reminders.")});
  };
  var ls=document.getElementById("lead");ls.value=String(lead);
  ls.onchange=function(){lead=+ls.value;tasks.forEach(function(t){t.notified=false});save()};

  function check(){
    var now=Date.now();
    tasks.forEach(function(t){
      if(t.status==="done"||t.notified)return;
      var ms=new Date(t.due)-now;
      if(ms>0&&ms<=lead*60000){
        t.notified=true;
        var msg=t.title+" is due in "+span(ms)+".";
        toast("Reminder: "+msg);
        try{if("Notification" in window&&Notification.permission==="granted")new Notification("Deadline Desk",{body:msg})}catch(e){}
        save();
      }
    });
    renderStats();
  }

  var th=document.getElementById("theme");
  th.onclick=function(){
    var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme=dark?"light":"dark";
  };

  load();
  var dd=new Date();dd.setDate(dd.getDate()+1);dd.setHours(23,59,0,0);document.getElementById("d").value=iso(dd);
  syncNotif();render();check();setInterval(check,30000);
})();
</script>
</body>
</html>
